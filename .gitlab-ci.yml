
stages:
  - build
  - deploy

variables:
  SSH_USER: "girjeshwhats"
  SERVER_IP: "66.116.244.42"
  SSH_PORT: "22"
  APP_DIR: "/home/girjeshwhats/scriza/ecoensa/website"
  PM2_APP_NAME: "ecoensa-website"

build:
  stage: build
  image: node:20-alpine

  before_script:
    - echo "Starting Next.js Pipeline..."

  script:
    - echo "Removing old node_modules..."
    - rm -rf node_modules

    - echo "Installing dependencies..."
    - npm ci

    - echo "Building Next.js app..."
    - npm run build

  artifacts:
    paths:
      - .next/
      - node_modules/
      - package.json
      - package-lock.json
      - next.config.js
      - public/
      - app/
      - components/
      - lib/
      - hooks/
      - tailwind.config.js
      - postcss.config.js
    expire_in: 1 hour

deploy:
  stage: deploy
  image: alpine:latest

  before_script:
    - apk add --no-cache openssh-client rsync
    - mkdir -p ~/.ssh

    # SSH KEY
    - echo "$SSH_PRIVATE_KEY" | base64 -d > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa

    # Known Hosts
    - touch ~/.ssh/known_hosts
    - ssh-keyscan -p "$SSH_PORT" -H "$SERVER_IP" >> ~/.ssh/known_hosts 2>/dev/null || true

  script:

    # Upload project files
    - echo "Uploading project files..."

    - |
      rsync -avz --delete \
        --exclude='.git' \
        -e "ssh -p $SSH_PORT -i ~/.ssh/id_rsa -o IdentitiesOnly=yes" \
        ./ "$SSH_USER@$SERVER_IP:$APP_DIR/"

    # Server deployment
    - |
      ssh -p "$SSH_PORT" \
        -i ~/.ssh/id_rsa \
        -o IdentitiesOnly=yes \
        "$SSH_USER@$SERVER_IP" << 'EOF'

      set -e

      cd /home/girjeshwhats/scriza/ecoensa/website

      echo "Removing old node_modules..."
      rm -rf node_modules

      echo "Installing dependencies..."
      npm ci

      echo "Building Next.js app..."
      npm run build

      echo "Checking PM2 application..."

      if pm2 describe ecoensa-website > /dev/null 2>&1; then

        echo "ecoensa-website already exists."
        echo "Restarting application..."

        pm2 restart ecoensa-website

      else

        echo "ecoensa-website does not exist."
        echo "Starting new application..."

        pm2 start npm \
          --name "ecoensa-website" \
          -- start -- --port 4010

      fi

      echo "Saving PM2..."
      pm2 save

      echo "PM2 Status:"
      pm2 status

      EOF

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

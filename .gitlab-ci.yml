stages:
  - build
  - deploy

variables:
  SSH_USER: "girjeshwhats"
  SERVER_IP: "66.116.244.42"
  SSH_PORT: "22"
  APP_DIR: "/home/girjeshwhats/scriza/ecoensa/website"
  PM2_APP_NAME: "ecoensa-website"

# =========================================================
# BUILD STAGE
# =========================================================

build:
  stage: build
  image: node:20-alpine

  before_script:
    - echo "Starting Next.js Pipeline..."

  script:
    - echo "Removing old node_modules..."
    - rm -rf node_modules

    - echo "Installing dependencies..."
    - npm ci

    - echo "Building Next.js application..."
    - npm run build

  artifacts:
    paths:
      - .next/
      - package.json
      - package-lock.json
      - next.config.js
      - public/
      - app/
      - components/
      - lib/
      - hooks/
      - tailwind.config.js
      - postcss.config.js
    expire_in: 1 hour


# =========================================================
# DEPLOY STAGE
# =========================================================

deploy:
  stage: deploy
  image: alpine:latest

  before_script:
    - apk add --no-cache openssh-client rsync
    - mkdir -p ~/.ssh

    # SSH KEY
    - echo "$SSH_PRIVATE_KEY" | base64 -d > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa

    # KNOWN HOSTS
    - touch ~/.ssh/known_hosts
    - ssh-keyscan -p "$SSH_PORT" -H "$SERVER_IP" >> ~/.ssh/known_hosts 2>/dev/null || true

  script:

    # =====================================================
    # UPLOAD SOURCE FILES
    # =====================================================

    - echo "Uploading project files to server..."

    - |
      rsync -avz \
        --exclude='.git' \
        --exclude='node_modules' \
        --exclude='.next' \
        --exclude='.env' \
        --exclude='.env.*' \
        -e "ssh -p $SSH_PORT -i ~/.ssh/id_rsa -o IdentitiesOnly=yes" \
        ./ "$SSH_USER@$SERVER_IP:$APP_DIR/"

    # =====================================================
    # SERVER DEPLOYMENT
    # =====================================================

    - |
      ssh -p "$SSH_PORT" \
        -i ~/.ssh/id_rsa \
        -o IdentitiesOnly=yes \
        "$SSH_USER@$SERVER_IP" << 'EOF'

      set -e

      APP_DIR="/home/girjeshwhats/scriza/ecoensa/website"
      PM2_APP_NAME="ecoensa-website"

      echo "======================================"
      echo "Starting server deployment..."
      echo "======================================"

      cd "$APP_DIR"

      echo "Current directory:"
      pwd

      echo "--------------------------------------"
      echo "Removing old node_modules..."
      echo "--------------------------------------"

      rm -rf node_modules

      echo "--------------------------------------"
      echo "Installing dependencies using npm ci..."
      echo "--------------------------------------"

      npm ci

      echo "--------------------------------------"
      echo "Building Next.js application..."
      echo "--------------------------------------"

      npm run build

      echo "--------------------------------------"
      echo "Checking PM2 application..."
      echo "--------------------------------------"

      if pm2 describe "$PM2_APP_NAME" > /dev/null 2>&1; then

        echo "Application already exists in PM2."
        echo "Restarting $PM2_APP_NAME..."

        pm2 restart "$PM2_APP_NAME" --update-env

      else

        echo "Application does not exist in PM2."
        echo "Starting new application..."

        pm2 start npm \
          --name "$PM2_APP_NAME" \
          -- start -- --port 4010

      fi

      echo "--------------------------------------"
      echo "Saving PM2 configuration..."
      echo "--------------------------------------"

      pm2 save

      echo "--------------------------------------"
      echo "PM2 Status"
      echo "--------------------------------------"

      pm2 status

      echo "--------------------------------------"
      echo "Recent Application Logs"
      echo "--------------------------------------"

      pm2 logs "$PM2_APP_NAME" --lines 20 --nostream || true

      echo "======================================"
      echo "Deployment completed successfully."
      echo "======================================"

      EOF

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
stages:
  - build
  - deploy

variables:
  SSH_USER: "girjeshwhats"
  # SERVER_IP: "72.62.196.87"
  SERVER_IP: "66.116.244.42"
  SSH_PORT: "22"
  APP_DIR: "/home/girjeshwhats/scriza/ecoensa/website"
  PM2_APP_NAME: "ecoensa-website"



before_script:
  - echo "Starting Next.js Pipeline..."

build:
  stage: build
  image: node:20-alpine

  script:
    - npm install
    - npm run build

  artifacts:
    paths:
      - .next/
      - node_modules/
      - package.json
      - package-lock.json
      - next.config.js
      - public/
      - app/
      - components/
      - lib/
      - hooks/
      - tailwind.config.js
      - postcss.config.js

deploy:
  stage: deploy
  image: alpine:latest

  before_script:
    - apk add --no-cache openssh-client rsync
    - mkdir -p ~/.ssh

    # SSH KEY
    - echo "$SSH_PRIVATE_KEY" | base64 -d > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa

    # Known Hosts
    - touch ~/.ssh/known_hosts
    - ssh-keyscan -p $SSH_PORT -H $SERVER_IP >> ~/.ssh/known_hosts 2>/dev/null || true

  script:
    # Upload project files
    - rsync -avz --delete -e "ssh -p $SSH_PORT -i ~/.ssh/id_rsa -o IdentitiesOnly=yes" ./ $SSH_USER@$SERVER_IP:$APP_DIR/

    # Restart PM2
    - |
      ssh -p $SSH_PORT -i ~/.ssh/id_rsa -o IdentitiesOnly=yes $SSH_USER@$SERVER_IP << 'EOF'

      cd /home/girjeshwhats/scriza/ecoensa/website

      echo "Installing dependencies..."
      npm install

      echo "Building Next.js app..."
      npm run build

      echo "Stopping old PM2 process..."
      pm2 delete ecoensa-website || true

      echo "Starting Next.js app on port 4010..."
      pm2 start npm --name "ecoensa-website" -- run dev -- --port 4010

      echo "Saving PM2..."
      pm2 save

      echo "PM2 Status:"
      pm2 status

      EOF
      

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
stages:
  - deploy

variables:
  SSH_USER: "girjeshwhats"
  SERVER_IP: "66.116.244.42"
  SSH_PORT: "22"

  APP_DIR: "/home/girjeshwhats/scriza/ecoensa/website"
  PM2_APP_NAME: "ecoensa-website"

# =========================================================
# DEPLOY
# =========================================================

deploy:
  stage: deploy

  image: alpine:latest

  before_script:
    - apk add --no-cache openssh-client rsync
    - mkdir -p ~/.ssh

    # SSH KEY
    - echo "$SSH_PRIVATE_KEY" | base64 -d > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa

    # KNOWN HOST
    - touch ~/.ssh/known_hosts
    - ssh-keyscan -p "$SSH_PORT" -H "$SERVER_IP" >> ~/.ssh/known_hosts 2>/dev/null || true

  script:

    # =====================================================
    # UPLOAD SOURCE
    # =====================================================

    - echo "======================================"
    - echo "Uploading project files..."
    - echo "======================================"

    - |
      rsync -avz \
        --delete \
        --exclude='.git' \
        --exclude='node_modules' \
        --exclude='.next' \
        --exclude='.env' \
        --exclude='.env.*' \
        -e "ssh -p $SSH_PORT -i ~/.ssh/id_rsa -o IdentitiesOnly=yes" \
        ./ "$SSH_USER@$SERVER_IP:$APP_DIR/"

    # =====================================================
    # SERVER DEPLOYMENT
    # =====================================================

    - |
      ssh -p "$SSH_PORT" \
        -i ~/.ssh/id_rsa \
        -o IdentitiesOnly=yes \
        "$SSH_USER@$SERVER_IP" << 'EOF'

      set -e

      APP_DIR="/home/girjeshwhats/scriza/ecoensa/website"
      PM2_APP_NAME="ecoensa-website"

      echo "======================================"
      echo "Starting Ecoensa deployment"
      echo "======================================"

      cd "$APP_DIR"

      echo "Current directory:"
      pwd

      echo "--------------------------------------"
      echo "Node version"
      echo "--------------------------------------"

      node -v
      npm -v

      echo "--------------------------------------"
      echo "Stopping PM2 application"
      echo "--------------------------------------"

      pm2 stop "$PM2_APP_NAME" || true

      echo "--------------------------------------"
      echo "Removing old node_modules"
      echo "--------------------------------------"

      rm -rf node_modules

      echo "--------------------------------------"
      echo "Installing dependencies"
      echo "--------------------------------------"

      npm ci

      echo "--------------------------------------"
      echo "Building Next.js application"
      echo "--------------------------------------"

      rm -rf .next

      npm run build

      echo "--------------------------------------"
      echo "Starting PM2 application"
      echo "--------------------------------------"

      if pm2 describe "$PM2_APP_NAME" > /dev/null 2>&1; then

        pm2 restart "$PM2_APP_NAME" --update-env

      else

        pm2 start npm \
          --name "$PM2_APP_NAME" \
          -- start -- --port 4010

      fi

      echo "--------------------------------------"
      echo "Checking PM2 status"
      echo "--------------------------------------"

      pm2 status

      echo "--------------------------------------"
      echo "Checking application"
      echo "--------------------------------------"

      sleep 5

      curl -f http://127.0.0.1:4010 || exit 1

      echo "--------------------------------------"
      echo "Recent logs"
      echo "--------------------------------------"

      pm2 logs "$PM2_APP_NAME" --lines 20 --nostream || true

      echo "======================================"
      echo "Deployment completed successfully"
      echo "======================================"

      EOF

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'